name: Update election news feed

on:
  schedule:
    # GitHub may delay scheduled runs by several minutes during busy periods.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources and rebuild feed.json
        run: python scripts/fetch_feeds.py

      - name: Commit feed.json if it changed
        run: |
          if [[ -n "$(git status --porcelain feed.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.json
            git commit -m "Update election news feed"
            git push
          else
            echo "feed.json unchanged"
          fi
